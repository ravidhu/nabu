[package]
name = "nabu"
version = "0.1.3"
edition = "2021"
rust-version = "1.83"
authors = ["Ravidhu Dissanayake"]
description = "macOS CLI that records mic + system audio and transcribes locally with mlx-whisper"
repository = "https://github.com/ravidhu/nabu"
license = "MIT"
readme = "README.md"
# Binary ships prebuilt via GitHub Releases; not published to crates.io.
publish = false

[[bin]]
name = "nabu"
path = "src/main.rs"

[profile.release]
strip = true
opt-level = 3

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

cpal = "0.15"
hound = "3.5"
rubato = "0.15"
crossbeam-channel = "0.5"
crossterm = "0.28"

dirs = "5"
chrono = "0.4"

# macOS system-audio capture via ScreenCaptureKit.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "0.3"
core-foundation = "0.9"

[dev-dependencies]
tempfile = "3"
